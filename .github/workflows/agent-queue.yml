# Starts a repair session for every live-check issue still waiting for one,
# so a session stopped by the Claude subscription's usage limit, or never
# started, is retried without anyone stepping in. An issue waits while it is
# open, labeled agent-repair, not handed over (needs-maintainer), and has no
# open pull request from the agent and no repair session already running.
name: Agent queue
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  issues: read
  pull-requests: read
  # Dispatching agent-repair.yml; runs started with the workflow token by
  # workflow_dispatch do start, unlike those from most other events.
  actions: write
concurrency:
  group: agent-queue
  cancel-in-progress: false
# The job has no checkout, so gh reads the repository from here.
env:
  GH_REPO: ${{ github.repository }}

jobs:
  dispatch:
    if: vars.LIVE_CHECK_BOT_LOGIN != ''
    runs-on: ubuntu-latest
    steps:
      - name: Start a session for each waiting issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BOT: ${{ vars.LIVE_CHECK_BOT_LOGIN }}
          AGENT: ${{ vars.AGENT_BOT_LOGIN }}
        run: |
          set -o pipefail
          gh api "repos/$REPO/issues?state=open&labels=agent-repair&per_page=100" \
            --jq ".[] | select(.pull_request == null and .user.login == env.BOT and ([.labels[].name] | index(\"needs-maintainer\") | not)) | .number" > waiting.txt
          # Sessions already queued or running, by the issue their run is named for.
          for status in queued in_progress waiting pending; do
            gh run list --workflow agent-repair.yml --status "$status" --limit 50 --json displayTitle --jq '.[].displayTitle'
          done | sed -n 's/^Agent repair for #\([0-9]*\)$/\1/p' | sort -u > running.txt
          gh api "repos/$REPO/pulls?state=open&per_page=100" --jq '.[] | select(.user.login == env.AGENT) | .body // ""' > open-pulls.txt
          started=0
          while read -r issue; do
            [ -z "$issue" ] && continue
            if grep -qx "$issue" running.txt; then echo "#$issue: a session is already queued or running"; continue; fi
            if grep -Eiq "\b(close[sd]?|fix(e[sd])?|resolve[sd]?) #$issue\b" open-pulls.txt; then echo "#$issue: the agent's pull request is open"; continue; fi
            echo "#$issue: starting a session"
            gh workflow run agent-repair.yml --repo "$REPO" -f issue="$issue"
            started=$((started + 1))
          done < waiting.txt
          echo "Started $started repair sessions; $(wc -l < waiting.txt | tr -d ' ') issues waiting." | tee -a "$GITHUB_STEP_SUMMARY"
