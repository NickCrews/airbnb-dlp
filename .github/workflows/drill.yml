# A drill of the self-healing loop. With no scenario, it is a plain live-check
# run. With one, it breaks the code on a throwaway drill/<run id> branch the
# way an upstream change would, runs the live check there, files the issue
# through the real path, and follows the repair: the agent's pull request, the
# required checks, the merge, and a passing live check afterwards. Nothing
# touches main and nothing is released.
name: Drill
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: What to break
        type: choice
        default: none
        options: [none, stale-hash, parser-break, blocked]
      keep_branch:
        description: Keep the drill branch and issue afterwards, for inspection
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: drill
  cancel-in-progress: false

env:
  SCENARIO: ${{ inputs.scenario }}
  BRANCH: drill/${{ github.run_id }}

jobs:
  # ------------------------------------------------------------------ no scenario
  live-check:
    name: live check (no scenario)
    if: inputs.scenario == 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node scripts/live-check/run.ts --out .live-check/out
      - if: always()
        run: |
          {
            echo '### Live check'
            echo
            node -e 'const r=require("./.live-check/out/report.json"); console.log(`${r.passed ? "Passed" : "Failed"}: ${r.requests} requests, ${r.failures.length} failures.`); for (const f of r.failures) console.log(`- [${f.category}] \`${f.check}\`: ${f.message}`)'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v5
        with: { name: drill-live-check, path: .live-check/out/, if-no-files-found: ignore }

  # ------------------------------------------------------------------ scenarios
  sabotage:
    name: break the code
    if: inputs.scenario != 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.LIVE_CHECK_APP_ID }}
          private-key: ${{ secrets.LIVE_CHECK_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v5
        with: { ref: main, token: '${{ steps.app.outputs.token }}' }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Commit the breakage to the drill branch
        run: |
          git switch -c "$BRANCH"
          node scripts/drill/sabotage.ts "$SCENARIO"
          git config user.name "${{ vars.LIVE_CHECK_BOT_LOGIN }}"
          git config user.email "${{ vars.LIVE_CHECK_APP_ID }}+${{ vars.LIVE_CHECK_BOT_LOGIN }}@users.noreply.github.com"
          git commit --allow-empty -am "Update from upstream"
          git push origin "$BRANCH"
          echo "Drill branch \`$BRANCH\`, scenario \`$SCENARIO\`." >> "$GITHUB_STEP_SUMMARY"

  detect:
    name: live check finds it
    needs: sabotage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      detected: ${{ steps.verdict.outputs.detected }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: '${{ env.BRANCH }}' }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Live check on the broken branch
        run: |
          node scripts/drill/scenario-info.ts "$SCENARIO" env >> "$GITHUB_ENV"
      - run: node scripts/live-check/run.ts --small --out .live-check/out || true
      - name: Expected category reported
        id: verdict
        run: |
          expected=$(node scripts/drill/scenario-info.ts "$SCENARIO" expect)
          found=$(node -e 'const r=require("./.live-check/out/report.json"); console.log(r.failures.map(f=>f.category).join(" "))')
          printf '### Detection\n\n| Step | Result | Detail |\n|---|---|---|\n' >> "$GITHUB_STEP_SUMMARY"
          if echo " $found " | grep -q " $expected "; then
            echo "detected=true" >> "$GITHUB_OUTPUT"
            echo "| live check finds it | pass | reported $expected (all: ${found}) |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "detected=false" >> "$GITHUB_OUTPUT"
            echo "| live check finds it | FAIL | expected $expected, reported: ${found:-nothing} |" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/upload-artifact@v5
        with: { name: drill-detect, path: .live-check/out/report.json }

  repair:
    name: issue, agent, checks, merge
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      issues: ${{ steps.file.outputs.issues }}
      repaired: ${{ steps.watch.outputs.repaired }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/download-artifact@v5
        with: { name: drill-detect, path: .live-check/detect }
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.LIVE_CHECK_APP_ID }}
          private-key: ${{ secrets.LIVE_CHECK_APP_PRIVATE_KEY }}
      - name: File the issue
        id: file
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
        run: node scripts/live-check/file-issues.ts .live-check/detect/report.json --drill "$BRANCH"
      - name: Follow the repair
        id: watch
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          AGENT_BOT_LOGIN: ${{ vars.AGENT_BOT_LOGIN }}
        run: node scripts/drill/watch.ts --scenario "$SCENARIO" --issues "${{ steps.file.outputs.issues }}" --branch "$BRANCH"

  verify:
    name: live check passes after the repair
    needs: repair
    if: needs.repair.outputs.repaired == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: { ref: '${{ env.BRANCH }}' }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Live check on the repaired branch
        run: |
          if node scripts/live-check/run.ts --small --out .live-check/out; then
            printf '### Verification\n\nThe live check passes on the repaired branch.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf '### Verification\n\nFAIL: the live check still fails on the repaired branch; see the drill-verify artifact.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - if: always()
        uses: actions/upload-artifact@v5
        with: { name: drill-verify, path: .live-check/out/, if-no-files-found: ignore }

  cleanup:
    name: clean up
    needs: [sabotage, detect, repair, verify]
    if: always() && inputs.scenario != 'none' && !inputs.keep_branch && needs.sabotage.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.LIVE_CHECK_APP_ID }}
          private-key: ${{ secrets.LIVE_CHECK_APP_PRIVATE_KEY }}
      - name: Close the drill's issues and pull requests, delete its branch
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ISSUES: ${{ needs.repair.outputs.issues }}
          REPO: ${{ github.repository }}
        run: |
          for n in $(echo "$ISSUES" | tr ',' ' '); do
            gh issue close "$n" --repo "$REPO" --comment "Drill finished: ${{ github.server_url }}/$REPO/actions/runs/${{ github.run_id }}" || true
          done
          gh pr list --repo "$REPO" --base "$BRANCH" --state open --json number --jq '.[].number' |
            while read -r pr; do gh pr close "$pr" --repo "$REPO" --delete-branch || true; done
          gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" || true
